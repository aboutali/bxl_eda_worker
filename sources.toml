# Source list for bxl_eda_worker.
# Verified state as of 2026-04. Edit URLs freely — no validation until fetch time.
#
# fields:
#   id              short stable identifier
#   name            display name in digest
#   type            "rss" | "eeas_html" | "headless_html"
#   url             fetch URL
#   category        "eu_institution" | "swiss_official" | "press_eu"
#                   | "press_swiss" | "press_intl" | "think_tank"
#   weight          1=low, 3=high; primary sources rank above secondary in digest
#   language        "en" | "de" | "fr" | "it"
#   selector        CSS selector for headless_html (anchor selector)
#   title_selector  optional CSS selector evaluated *inside* each anchor to get a clean title
#   badge           optional short tag shown next to source name

# ─────────────────────────────────────────────────────────────────────────────
# EU INSTITUTIONS — primary sources
# ─────────────────────────────────────────────────────────────────────────────

[[sources]]
id = "eeas_press"
name = "EEAS — Press Material"
type = "eeas_html"
url = "https://www.eeas.europa.eu/eeas/press-material_en"
category = "eu_institution"
weight = 3
language = "en"

[[sources]]
id = "council_press"
name = "Council of the EU — Press Releases"
type = "headless_html"
url = "https://www.consilium.europa.eu/en/press/press-releases/"
category = "eu_institution"
weight = 3
language = "en"
selector = "a.gsc-excerpt-item__link"
title_selector = ".gsc-excerpt-item__title"
# Note: this listing covers ALL Council press releases; FAC items are then
# tagged by the keyword classifier (HIGH_FP_KEYWORDS contains "foreign affairs
# council" / "fac"). Cross-source clustering then merges these with press
# coverage of the same item.

# Foreign Affairs Council meetings — past and upcoming. The /en/meetings/fac/
# page redirects to the calendar with CouncilConfiguration=122512 (the FAC
# tag id, verified against live DOM). Anchor pattern matches council_press;
# titles are clean directly from anchor text so no title_selector is needed.
# Captures FAC dates, agendas and main results that don't always appear on the
# generic press-releases list.
[[sources]]
id = "council_fac"
name = "Council of the EU — Foreign Affairs Council"
type = "headless_html"
url = "https://www.consilium.europa.eu/en/meetings/calendar/?CouncilConfiguration=122512"
category = "eu_institution"
weight = 3
language = "en"
selector = "a.gsc-excerpt-item__link"
badge = "FAC"

